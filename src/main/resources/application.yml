spring:
  application:
    name: lin-ai-agent
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  ai:
    dashscope:
      chat:
        options:
          model: qwen3.7-max
          multi-model: false
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.aloha.linaiagent.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
app:
  cors:
    path-pattern: /**
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:3000
      - http://127.0.0.1:3000
      - http://localhost:8080
      - http://127.0.0.1:8080
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - Content-Disposition
    allow-credentials: true
    max-age: 3600
